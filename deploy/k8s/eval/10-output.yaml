apiVersion: v1
kind: PersistentVolume
metadata:
  name: sceneproof-eval-output
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: sceneproof-eval
    name: eval-output
  local:
    path: /tmp/sceneproof-eval-out
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [sceneproof-eval-control-plane]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eval-output
  namespace: sceneproof-eval
spec:
  storageClassName: ""
  volumeName: sceneproof-eval-output
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
