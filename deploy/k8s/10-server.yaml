# Review server: HTTP console/API (8000) + gRPC ingest (50052). One replica; SQLite on a PVC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: server-data, namespace: sceneproof }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: server, namespace: sceneproof, labels: { app: server } }
spec:
  replicas: 1
  strategy: { type: Recreate }   # SQLite + RWO volume: never two writers
  selector: { matchLabels: { app: server } }
  template:
    metadata: { labels: { app: server } }
    spec:
      containers:
        - name: server
          image: sceneproof-server:local
          imagePullPolicy: IfNotPresent
          args: ["run"]
          env:
            - { name: SP_SERVER_DATA_DIR, value: /data }
            - { name: SP_SERVER_VLM_PROVIDER, value: mock }
            - { name: SP_SERVER_GRPC_LISTEN, value: "0.0.0.0:50052" }
          ports:
            - { name: http, containerPort: 8000 }
            - { name: grpc, containerPort: 50052 }
          readinessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 10, failureThreshold: 6, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 250m, memory: 384Mi }, limits: { cpu: "1", memory: 1Gi } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: server-data }
---
apiVersion: v1
kind: Service
metadata: { name: server, namespace: sceneproof }
spec:
  selector: { app: server }
  ports:
    - { name: http, port: 8000, targetPort: http }
    - { name: grpc, port: 50052, targetPort: grpc }
