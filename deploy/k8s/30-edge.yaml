# One "edge device" = one pod with two containers sharing an emptyDir for evidence:
#   analyzer (Python) -> gateway (Go, localhost:50051) -> server (grpc)
apiVersion: v1
kind: ConfigMap
metadata: { name: edge-config, namespace: zonewatch }
data:
  edge.yaml: |
    device_id: edge-k8s-01
    gateway: 127.0.0.1:50051
    status_interval_s: 2.0
    evidence_root: /evidence
    detector: { variant: yolox_tiny, backend: onnxruntime, model: /models/yolox_tiny.onnx, conf_threshold: 0.4, nms_threshold: 0.45, intra_op_threads: 2 }
    tracker: { track_thresh: 0.5, low_thresh: 0.1, new_track_thresh: 0.6, match_thresh: 0.8, track_buffer_seconds: 1.5 }
    pipeline: { source_backend: auto, queue_capacity: 4, ring_seconds: 12, ring_max_mb: 64, ring_max_side: 960, pre_roll_s: 3, post_roll_s: 3, clip_fps: 10 }
    cameras:
      - camera_id: cam-bench
        name: "B동 작업대 (k8s RTSP)"
        source: rtsp://rtsp-sim.zonewatch.svc.cluster.local:8554/one-by-one
        autostart: true
        fps_hint: 10
        zones:
          - { zone_id: z-bench, name: "작업대 반경 통제구역", polygon: [[0.40, 0.58], [0.76, 0.58], [0.80, 1.0], [0.36, 1.0]], entry_confirm_frames: 3, exit_confirm_frames: 4, entry_confirm_seconds: 0.3, exit_confirm_seconds: 0.8, dwell_seconds: 5, lost_grace_seconds: 1.5 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: edge, namespace: zonewatch, labels: { app: edge } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: edge } }
  template:
    metadata: { labels: { app: edge } }
    spec:
      containers:
        - name: gateway
          image: zonewatch-gateway:local
          imagePullPolicy: IfNotPresent
          args: ["--listen", ":50051", "--server", "server.zonewatch.svc.cluster.local:50052", "--device-id", "edge-k8s-01",
                 "--queue-dir", "/queue", "--evidence-root", "/evidence", "--http", ":9100", "--insecure"]
          ports: [{ name: gw-http, containerPort: 9100 }, { name: gw-grpc, containerPort: 50051 }]
          readinessProbe: { httpGet: { path: /readyz, port: gw-http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: gw-http }, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
          volumeMounts: [{ name: evidence, mountPath: /evidence, readOnly: true }, { name: queue, mountPath: /queue }]
        - name: analyzer
          image: zonewatch-edge:local
          imagePullPolicy: IfNotPresent
          args: ["--config", "/config/edge.yaml", "run"]
          resources: { requests: { cpu: "1", memory: 768Mi }, limits: { cpu: "2", memory: 1536Mi } }
          volumeMounts:
            - { name: evidence, mountPath: /evidence }
            - { name: config, mountPath: /config, readOnly: true }
            - { name: models, mountPath: /models, readOnly: true }
      volumes:
        - name: evidence
          emptyDir: { sizeLimit: 512Mi }   # bounded like the ring buffer: evidence is uploaded, not archived here
        - name: queue
          emptyDir: { sizeLimit: 128Mi }   # survives container restarts within the pod; a PVC for pod rescheduling
        - name: config
          configMap: { name: edge-config }
        - name: models
          emptyDir: {}
      initContainers:
        - name: fetch-models
          image: zonewatch-edge:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp /app/models/yolox_tiny.onnx /models/ 2>/dev/null || python -c \"print('no baked model')\""]
          volumeMounts: [{ name: models, mountPath: /models }]
