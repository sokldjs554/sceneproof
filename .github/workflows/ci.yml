name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System deps (ffmpeg, GStreamer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-rtsp \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gir1.2-gst-rtsp-server-1.0 \
            libgirepository-2.0-dev libcairo2-dev pkg-config libgl1
      - name: Install
        run: |
          python -m pip install -U pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[server,dev,gst]" onnx
      - name: Lint
        run: ruff check src tests scripts
      - name: Fetch models (nano+tiny) and sample videos
        run: |
          VARIANTS="yolox_nano yolox_tiny" bash scripts/fetch_models.sh
          bash scripts/fetch_data.sh
      - name: Unit tests (incl. PyTorch<->ONNX parity)
        run: pytest -q -m "not slow"
      - name: Console smoke (Playwright, replay bundle)
        run: |
          npm i -g playwright@1.63.0 && npx playwright install --with-deps chromium
          SP_SERVER_DATA_DIR=/tmp/zw SP_SERVER_MODE=replay SP_SERVER_REPLAY_BUNDLE=demo/bundle SP_SERVER_VLM_PROVIDER=mock \
            sceneproof-server run --port 8000 > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
          SP_CONSOLE_URL=http://127.0.0.1:8000/ NODE_PATH=$(npm root -g) node scripts/console_check.mjs /tmp/ui || (cat /tmp/server.log; exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: console-screenshots, path: /tmp/ui }
      - name: Proto freshness (python)
        run: |
          python -m grpc_tools.protoc -I proto --python_out=/tmp/gen --grpc_python_out=/tmp/gen proto/sceneproof/v1/sceneproof.proto 2>/dev/null || mkdir -p /tmp/gen
          python -m grpc_tools.protoc -I proto --python_out=/tmp/gen --grpc_python_out=/tmp/gen proto/sceneproof/v1/sceneproof.proto
          diff <(grep -v '^#' /tmp/gen/sceneproof/v1/sceneproof_pb2.py) <(grep -v '^#' src/sceneproof/proto/sceneproof/v1/sceneproof_pb2.py) || (echo "generated python proto is stale: run scripts/gen_proto.sh" && exit 1)
  go-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache-dependency-path: gateway/go.sum }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: make build
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Sample videos + ONNX model (baked into images)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          bash scripts/fetch_data.sh
          pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -e ".[torch]"
          VARIANTS="yolox_tiny" bash scripts/fetch_models.sh
      - name: Build images
        run: |
          docker build -f deploy/docker/Dockerfile.server -t sceneproof-server:ci .
          docker build -t sceneproof-gateway:ci gateway
          docker build -f deploy/docker/Dockerfile.edge -t sceneproof-edge:ci .
          docker build -f deploy/docker/Dockerfile.rtsp-sim -t sceneproof-rtsp-sim:ci .
      - name: Smoke server image
        run: |
          docker run -d --name srv -p 8000:8000 -e SP_SERVER_VLM_PROVIDER=mock sceneproof-server:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/status
          docker rm -f srv
