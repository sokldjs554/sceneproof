[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneproof"
version = "0.1.0"
description = "산업현장 제한구역 접근·체류 영상 사건 검토 서비스 — CV(탐지·추적·구역 판정) + VLM(장면 해석) + 엣지 게이트웨이 + 검토 콘솔"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "sokldjs554" }]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.19",
  "scipy>=1.13",
  "grpcio>=1.66",
  "protobuf>=5.28",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "psutil>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "anthropic>=0.40",
]
torch = ["torch>=2.4", "onnx>=1.16"]
# remotezip: scripts/fetch_bench.py reads only the needed sequences out of the MOT zips;
# imageio-ffmpeg: a ready-made ffmpeg when none is installed (Homebrew builds it from source on older Macs)
bench = ["remotezip>=0.12", "imageio-ffmpeg>=0.5"]
gst = ["pygobject>=3.50", "pycairo>=1.26"]
vlm-local = ["transformers>=4.46", "torch>=2.4", "pillow>=10"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "grpcio-tools>=1.66",
  "ruff>=0.6",
  "pillow>=10",
  "playwright>=1.47",
]

[project.scripts]
sceneproof-edge = "sceneproof.edge.cli:main"
sceneproof-server = "sceneproof.server.cli:main"
sceneproof-eval = "sceneproof.eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sceneproof = ["py.typed", "server/prompts/*.md", "server/schemas/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["src/sceneproof/proto", "src/sceneproof/edge/yolox_model"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "SIM108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "gst: needs GStreamer (PyGObject)",
  "torch: needs PyTorch",
  "slow: long-running",
  "integration: needs built gateway binary / network",
]
filterwarnings = ["ignore::DeprecationWarning"]
