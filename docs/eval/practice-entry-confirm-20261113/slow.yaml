    name: 통로 안쪽 재고 구역
    polygon:
    - - 0.28
      - 0.18
    - - 0.6
      - 0.18
    - - 0.72
      - 0.45
    - - 0.22
      - 0.45
    entry_confirm_frames: 5
    exit_confirm_frames: 8
    entry_confirm_seconds: 1.0
    exit_confirm_seconds: 0.8
