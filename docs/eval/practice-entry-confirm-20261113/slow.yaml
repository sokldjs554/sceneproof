device_id: eval-01
gateway: 127.0.0.1:50051
evidence_root: data/evidence-eval
detector:
  variant: yolox_tiny
  backend: onnxruntime
  model: models/yolox_tiny.onnx
  conf_threshold: 0.4
  nms_threshold: 0.45
  intra_op_threads: 4
tracker:
  track_thresh: 0.5
  low_thresh: 0.1
  new_track_thresh: 0.6
  match_thresh: 0.8
  track_buffer_seconds: 1.5
pipeline:
  source_backend: auto
  queue_capacity: 4
  ring_seconds: 12
  ring_max_mb: 128
  ring_max_side: 960
  pre_roll_s: 3
  post_roll_s: 3
  clip_fps: 10
cameras:
- camera_id: eval-campus
  name: 옥외 보행로 (평가)
  source: file://data/videos/campus-walkway.mp4
  split: eval
  realtime: false
  fps_hint: 10
  zones:
  - zone_id: z-grass
    name: 잔디 출입금지 구역
    polygon:
    - - 0.0
      - 0.44
    - - 0.36
      - 0.5
    - - 0.53
      - 0.63
    - - 0.61
      - 0.82
    - - 0.66
      - 1.0
    - - 0.0
      - 1.0
    entry_confirm_frames: 3
    exit_confirm_frames: 5
    entry_confirm_seconds: 1.0
    exit_confirm_seconds: 0.8
    dwell_seconds: 5
    lost_grace_seconds: 1.5
- camera_id: eval-indoor
  name: 실내 출입문 앞 (평가)
  source: file://data/videos/people-indoor.mp4
  split: eval
  realtime: false
  fps_hint: 12
  zones:
  - zone_id: z-door
    name: 출입문 앞 통제구역
    polygon:
    - - 0.02
      - 0.52
    - - 0.33
      - 0.5
    - - 0.36
      - 0.98
    - - 0.02
      - 0.98
    entry_confirm_frames: 3
    exit_confirm_frames: 5
    entry_confirm_seconds: 1.0
    exit_confirm_seconds: 0.8
    dwell_seconds: 5
    lost_grace_seconds: 1.5
- camera_id: eval-store
  name: 매장 통로 안쪽 (평가)
  source: file://data/videos/store-aisle.mp4
  split: eval
  realtime: false
  fps_hint: 30
  zones:
