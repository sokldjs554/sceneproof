# Same as edge.yaml but sources point at the compose RTSP simulator service and the evidence path is the shared volume.
device_id: edge-01
gateway: gateway:50051
status_interval_s: 2.0
evidence_root: data/evidence
detector: { variant: yolox_tiny, backend: onnxruntime, model: models/yolox_tiny.onnx, conf_threshold: 0.4, nms_threshold: 0.45, intra_op_threads: 2 }
tracker: { track_thresh: 0.5, low_thresh: 0.1, new_track_thresh: 0.6, match_thresh: 0.8, track_buffer_seconds: 1.5 }
pipeline: { source_backend: auto, queue_capacity: 4, ring_seconds: 12, ring_max_mb: 96, ring_max_side: 960, pre_roll_s: 3, post_roll_s: 3, clip_fps: 10 }
cameras:
  - camera_id: cam-worker
    name: "A동 자재창고 입구 (RTSP 시뮬레이터)"
    source: rtsp://rtsp-sim:8554/worker-zone
    autostart: true
    fps_hint: 30
    zones:
      - { zone_id: z-tape, name: "황색 테이프 통제구역", polygon: [[0.52, 0.49], [0.66, 0.49], [0.98, 0.80], [0.98, 1.0], [0.22, 1.0]], entry_confirm_frames: 5, exit_confirm_frames: 8, dwell_seconds: 5, lost_grace_seconds: 1.5 }
  - camera_id: cam-bench
    name: "B동 작업대 (RTSP 시뮬레이터)"
    source: rtsp://rtsp-sim:8554/one-by-one
    autostart: false
    fps_hint: 10
    zones:
      - { zone_id: z-bench, name: "작업대 반경 통제구역", polygon: [[0.40, 0.58], [0.76, 0.58], [0.80, 1.0], [0.36, 1.0]], entry_confirm_frames: 3, exit_confirm_frames: 4, dwell_seconds: 5, lost_grace_seconds: 1.5 }
