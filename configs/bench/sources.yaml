# Benchmark sources: research-licensed datasets with HAND-LABELLED person boxes on static cameras.
# Raw frames are never committed — scripts/fetch_bench.py downloads them from the original hosts and
# re-encodes each sequence to H.264 so that video frame i == ground-truth frame i.
# "group": sequences that show the same physical event (CAVIAR Lisbon corridor/front views of one take)
# share a group; a split assigns whole groups, never single views (no leakage between splits).
datasets:
  caviar:
    base_url: https://homepages.inf.ed.ac.uk/rbf/
    license: "Creative Commons BY-SA (as stated on the CAVIAR data page)"
    attribution: "EC Funded CAVIAR project/IST 2001 37540, http://homepages.inf.ed.ac.uk/rbf/CAVIAR/"
    ground_truth: "per-frame person boxes found by hand-labelling the images (CVML XML); people who never move during a clip may be unboxed (INRIA set)"
    page: https://homepages.inf.ed.ac.uk/rbf/CAVIARDATA1/
  mot16:
    zip_url: https://motchallenge.net/data/MOT16.zip
    license: "CC BY-NC-SA 3.0 (MOTChallenge)"
    attribution: "Milan, Leal-Taixe, Reid, Roth, Schindler: MOT16: A Benchmark for Multi-Object Tracking, arXiv:1603.00831"
    ground_truth: "per-frame boxes annotated by hand following the MOT16 protocol (all persons incl. occluded and static ones)"
    page: https://motchallenge.net/data/MOT16/
  mot20:
    zip_url: https://motchallenge.net/data/MOT20.zip
    license: "CC BY-NC-SA 3.0 (MOTChallenge)"
    attribution: "Dendorfer et al.: MOT20: A benchmark for multi object tracking in crowded scenes, arXiv:2003.09003"
    ground_truth: "per-frame boxes annotated by hand following the MOTChallenge protocol"
    page: https://motchallenge.net/data/MOT20/
excluded:
  - {name: Fight_OneManDown, reason: "three different ground-truth files (Fight_OneManDown/fomdgt1.xml, Fight_OneManDown/fomdgt2.xml, Fight_OneManDown/fomdgt3.xml) with different person sets — ambiguous"}
  - {name: CHAD, reason: "person boxes were produced by YOLOv4 + HRNet (paper §4), not by people — cannot serve as human ground truth"}
  - {name: VIRAT Ground 2.0, reason: "hand-labelled and long, but download requires accepting the VIRAT Video Dataset Protection Agreement — left for the user to decide"}
  - {name: MOT16 moving-camera sequences (05/10/11/13), reason: "zones are defined in image coordinates; a moving camera has no fixed zone"}
sequences:
