# SceneProof edge (analyzer) configuration — the demo/dev set.
# Zones are normalized polygons (0..1 of frame width/height). The anchor point of a person is
# the bottom-centre of the box (feet). Entry needs `entry_confirm_frames` consecutive in-zone
# frames, exit needs `exit_confirm_frames` consecutive out-of-zone frames; dwell is media time.
device_id: edge-01
gateway: 127.0.0.1:50051
status_interval_s: 2.0
evidence_root: data/evidence

detector:
  variant: yolox_tiny          # yolox_nano | yolox_tiny | yolox_s (COCO, person class only)
  backend: onnxruntime         # onnxruntime | torch
  model: models/yolox_tiny.onnx
  conf_threshold: 0.4
  nms_threshold: 0.45
  intra_op_threads: 4
  graph_optimization: all

tracker:
  track_thresh: 0.5
  low_thresh: 0.1
  new_track_thresh: 0.6
  match_thresh: 0.8
  track_buffer_seconds: 1.5
  fuse_score: true
# Crowded sites: a camera may carry its own `tracker:` block. Measured on crowded tuning videos (benchmark
# docs/eval/bench/README.md §6): new_track_thresh 0.7 + track_buffer_seconds 3.0 cut split events (duplicates) by
# ~40% but missed ~1% more entries. The default above keeps misses lowest (safety first).
#   cameras:
#     - camera_id: cam-station
#       tracker: { track_thresh: 0.5, low_thresh: 0.1, new_track_thresh: 0.7, match_thresh: 0.8, track_buffer_seconds: 3.0 }

pipeline:
  source_backend: auto         # auto | gstreamer | opencv
  queue_capacity: 4            # frames waiting for analysis; oldest dropped when full
  ring_seconds: 12             # pre-roll evidence memory (seconds)
  ring_max_mb: 128             # hard cap for the ring buffer
  ring_max_side: 960           # evidence frames are stored at most this wide/high
  pre_roll_s: 3
  post_roll_s: 3
  clip_fps: 10
  trajectory_stride: 3
  rtsp_latency_ms: 200
  rtsp_protocols: tcp

# Zone options besides the polygon and timing (defaults shown):
#   rejoin: true          # the tracker gave the same person a new id (crowd, occlusion): continue the open event
#   rejoin_dist_rel: 1.0  # ...if the new track appears within this many box heights of where the person should be
#   exclude: []           # polygons inside the zone over person-shaped objects (mannequin, signboard, statue):
#                         # feet there never open an event; an open event is kept while the person crosses them
cameras:
  - camera_id: cam-worker
    name: "A동 자재창고 입구 (샘플)"
    source: file://data/videos/worker-zone.mp4
    split: dev
    autostart: false
    realtime: true
    fps_hint: 30
    zones:
      - zone_id: z-tape
        name: "황색 테이프 통제구역"
        polygon: [[0.52, 0.49], [0.66, 0.49], [0.98, 0.80], [0.98, 1.0], [0.22, 1.0]]
        entry_confirm_frames: 5
        exit_confirm_frames: 8
        entry_confirm_seconds: 0.3
        exit_confirm_seconds: 0.8
        dwell_seconds: 5
        lost_grace_seconds: 1.5
  - camera_id: cam-bench
    name: "B동 작업대 (샘플)"
    source: file://data/videos/one-by-one.mp4
    split: dev
    autostart: false
    realtime: true
    fps_hint: 10
    zones:
      - zone_id: z-bench
        name: "작업대 반경 통제구역"
        polygon: [[0.40, 0.58], [0.76, 0.58], [0.80, 1.0], [0.36, 1.0]]
        entry_confirm_frames: 3
        exit_confirm_frames: 4
        entry_confirm_seconds: 0.3
        exit_confirm_seconds: 0.8
        dwell_seconds: 5
        lost_grace_seconds: 1.5
  - camera_id: cam-rtsp-worker
    name: "A동 자재창고 입구 (RTSP 시뮬레이터)"
    source: rtsp://127.0.0.1:8554/worker-zone
    split: dev
    autostart: false
    fps_hint: 30
    zones:
      - zone_id: z-tape
        name: "황색 테이프 통제구역"
        polygon: [[0.52, 0.49], [0.66, 0.49], [0.98, 0.80], [0.98, 1.0], [0.22, 1.0]]
        entry_confirm_frames: 5
        exit_confirm_frames: 8
        entry_confirm_seconds: 0.3
        exit_confirm_seconds: 0.8
        dwell_seconds: 5
        lost_grace_seconds: 1.5
